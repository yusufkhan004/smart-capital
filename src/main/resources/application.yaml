server:
  port: 8081
  servlet:
    context-path: /api
spring:
  application:
    name: SmartCapital
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart-capital?useSSL=false&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
smartcapital:
  queue:
    upload-new-portfolio-queue: upload-new-portfolio-queue
    save-new-portfolio-queue: save-new-portfolio-queue
  document-path:
    base-path: "/home/neosoft/Documents/"  #TODO Add your folder path for base path
    portfolio-upload-docs: "/upload-docs/portfolio/"